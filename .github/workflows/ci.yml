name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest Suite & Validations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/job_tracker_test
        run: |
          alembic upgrade head

      - name: Execute pytest test suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/job_tracker_test
          SECRET_KEY: test-ci-secret-key-super-secure
          ENVIRONMENT: test
        run: |
          pytest -v --tb=short
